# DISTANCE 常规测评任务目录
# 查看任务: python -m distance.run_sequence --config configs/evaluation.yaml --list-tasks
# 运行任务: python -m distance.run_sequence --config configs/evaluation.yaml --task <任务名>

# ----------------------------------------------------------------------------
# 参数说明（重复出现的参数仅在此说明一次）
# ----------------------------------------------------------------------------
# 根路径与继承
#   project_root: 项目根目录；相对路径以此为基准。
#   datasets_root: 所有数据集的统一根目录。
#   outputs_root: 所有测评结果的统一根目录。
#   defaults: 所有任务共享的默认值；任务中的同名参数优先级更高。
#
# 数据集参数（datasets）
#   dir_2d: 2D 序列目录，包含 image、indexLabel、poses2d.csv 和相机标定。
#   dir_3d: 3D 序列目录，包含 Clouds、Labels 和 poses3d.csv。
#   min_class_pixels: GT 中目标类别的最少像素数；不足时跳过对应帧。
#   dataset_overrides: 仅对当前任务覆盖数据集定义中的字段。
#   pred_mask_dir: 已有预测 mask 的读取目录；在线推理任务也用它描述目标位置。
#
# 模型参数（models / segmentation）
#   enabled: true 表示运行在线分割；false 表示直接读取已有预测 mask。
#   config: MMSeg 模型配置文件路径。
#   checkpoint: 模型权重路径。
#   device: 推理设备，例如 cuda:0 或 cpu。
#   class_ids: 在线推理后合并为前景二值 mask 的预测类别 ID 列表。
#   pred_mask_output_dir: 在线推理生成的 mask 保存目录。
#
# Mask 参数（mask_profiles）
#   gt / pred: 分别定义 GT 和预测 mask 的读取方式。
#   type: index=类别索引图，binary=二值图，color_threshold=按 RGB 范围提取。
#   threshold: color_threshold 使用的颜色阈值集合。
#   r_min/r_max、g_min/g_max、b_min/b_max: RGB 各通道允许范围（含边界）。
#   g_minus_r_min、g_minus_b_min: G-R 与 G-B 的最小差值，用于筛选绿色系区域；
#                                      设为 -255 等价于不限制该差值。
#
# 任务选择与输出（tasks）
#   dataset: 引用 datasets 中的数据集定义。
#   model: 引用 models 中的在线模型或 cached_masks。
#   mask_profile: 引用 mask_profiles 中的 mask 解析规则。
#   output_dir: 当前任务的结果目录。
#   label3d_dtype: .label 文件的数据类型，必须与实际存储格式一致。
#   class.name: 输出文件及统计中使用的目标类别名称。
#   class.id_2d: GT indexLabel 中的目标类别 ID。
#   class.id_3d_for_h: 用于拟合地面和 H 矩阵的 3D 标签类别 ID。
#
# H 候选与几何参数
#   h_search_window_sec: 每帧点云只搜索时间差不超过 ±该值（秒）的候选图片。
#   h_candidate_reproj_tolerance_px: 候选与最低重投影误差的允许差值（像素）；
#                                     容差内优先选择时间最接近点云的图片。
#   geometry.max_timestamp_diff_sec: 点云锚点与初始匹配图片允许的最大时间差（秒）。
#   geometry.pose2d_direction: 2D 位姿方向，sensor_to_world 或 world_to_sensor。
#   geometry.pose3d_direction: 3D 位姿方向，sensor_to_world 或 world_to_sensor。
#   geometry.use_distortion: 投影时是否应用相机畸变参数。
#
# 扫描线参数（scanline）
#   step_px: 相邻水平扫描线的纵向像素间隔。
#   u_min/u_max: 参与评估的横向像素范围（含边界）。
#   max_ground_distance_m: 丢弃距离相机超过该值的地面边界点。
#   multi_run_matching: 一行有多个前景区间时，是否进行多区间边界匹配。
#   gt_edge_margin_px: 忽略距离 GT 图像边缘小于该值的边界点。
#   min_scanlines_per_frame: 一帧至少包含多少条有效扫描线才计入序列汇总。

project_root: .
datasets_root: ../data
outputs_root: ./outputs

defaults:
  project_root: ${project_root}
  label3d_dtype: uint32
  scanline:
    step_px: 10
    u_min: 0
    u_max: 9999

# 数据集只描述稳定不变的目录结构；任务可通过 dataset_overrides 覆盖个别字段。
datasets:
  scene204:
    dir_2d: ${datasets_root}/scene204/WildScenes2d/FRONT_CAMERA
    dir_3d: ${datasets_root}/scene204/WildScenes3d
    min_class_pixels: 50000
  wildscenes_mini:
    dir_2d: ${datasets_root}/wildscenes_mini/WildScenes2d
    dir_3d: ${datasets_root}/wildscenes_mini/WildScenes3d
    min_class_pixels: 800000
  wildscenes_v01:
    dir_2d: ${datasets_root}/61541v003/data/WildScenes/WildScenes2d/V-01
    dir_3d: ${datasets_root}/61541v003/data/WildScenes/WildScenes3d/V-01
    min_class_pixels: 800000

models:
  cached_masks:
    enabled: false
  wildscenes_deeplabv3:
    enabled: true
    config: ../wildscenes/configs/deeplabv3/deeplabv3_r50-d8_2xb20-80k_wildscenes-512x512_standard.py
    checkpoint: ../pretrained_models/deeplabv3_wildscenes.pth
    device: cuda:0
  goose64_deeplabv3_terrain:
    enabled: true
    config: ../wildscenes/configs/deeplabv3/deeplabv3_r50-d8_2xb20-80k_goose-512x512.py
    checkpoint: ../pretrained_models/ddrnet_goose64_best_mIoU_iter_72000.pth
    device: cuda:0
    # Match the old GOOSE Category "Terrain" class:
    # snow, cobble, asphalt, gravel, soil.
    class_ids: [2, 3, 23, 24, 31]
mask_profiles:
  wildscenes_dirt:
    gt:
      type: index
    pred:
      type: color_threshold
      threshold:
        r_min: 0
        r_max: 144
        g_min: 110
        g_max: 255
        b_min: 0
        b_max: 144
        g_minus_r_min: 35
        g_minus_b_min: 35
  scene204_road:
    gt:
      type: index
    pred:
      type: color_threshold
      threshold:
        r_min: 118
        r_max: 138
        g_min: 54
        g_max: 74
        b_min: 118
        b_max: 138
        g_minus_r_min: -255
        g_minus_b_min: -255
  scene204_road_online:
    gt:
      type: index
    pred:
      type: binary
  goose_terrain_as_road:
    gt:
      type: index
    pred:
      type: color_threshold
      threshold:
        r_min: 160
        r_max: 200
        g_min: 110
        g_max: 150
        b_min: 50
        b_max: 90
        g_minus_r_min: -255
        g_minus_b_min: -255

tasks:
  scene204_road:
    dataset: scene204
    dataset_overrides:
      pred_mask_dir: ${datasets_root}/scene204/WildScenes2d/FRONT_CAMERA/deeplabv3_pred_mask
    model: goose64_deeplabv3_terrain
    mask_profile: scene204_road_online
    output_dir: ${outputs_root}/scene204_road
    h_search_window_sec: 0.2
    label3d_dtype: uint8
    class: {name: road, id_2d: 1, id_3d_for_h: 11}
    segmentation:
      pred_mask_output_dir: ${datasets_root}/scene204/WildScenes2d/FRONT_CAMERA/deeplabv3_pred_mask
    geometry:
      max_timestamp_diff_sec: 0.3
    scanline:
      max_ground_distance_m: 20.0

  scene204_road_scratch:
    dataset: scene204
    dataset_overrides:
      pred_mask_dir: ${datasets_root}/scene204/WildScenes2d/FRONT_CAMERA/scratch_pred_mask
    model: cached_masks
    mask_profile: scene204_road
    output_dir: ${outputs_root}/scene204_road_scratch
    h_search_window_sec: 15.0
    label3d_dtype: uint8
    class: {name: road, id_2d: 1, id_3d_for_h: 11}
    geometry:
      max_timestamp_diff_sec: 0.3
    scanline:
      max_ground_distance_m: 20.0

  scene204_road_finetune:
    dataset: scene204
    dataset_overrides:
      pred_mask_dir: ${datasets_root}/scene204/WildScenes2d/FRONT_CAMERA/finetune_pred_mask
    model: cached_masks
    mask_profile: scene204_road
    output_dir: ${outputs_root}/scene204_road_finetune
    h_search_window_sec: 15.0
    label3d_dtype: uint8
    class: {name: road, id_2d: 1, id_3d_for_h: 11}
    geometry:
      max_timestamp_diff_sec: 0.3
    scanline:
      max_ground_distance_m: 20.0

  wildscenes_mini:
    dataset: wildscenes_mini
    dataset_overrides:
      pred_mask_dir: ${datasets_root}/wildscenes_mini/WildScenes2d/deeplabv3_pred_mask
    model: wildscenes_deeplabv3
    mask_profile: wildscenes_dirt
    output_dir: ${outputs_root}/sequence_mini_dirt
    h_search_window_sec: 15.0
    class: {name: dirt, id_2d: 2, id_3d_for_h: 1}
    segmentation:
      pred_mask_output_dir: ${datasets_root}/wildscenes_mini/WildScenes2d/deeplabv3_pred_mask

  wildscenes_mini_cached:
    dataset: wildscenes_mini
    dataset_overrides:
      pred_mask_dir: ${datasets_root}/wildscenes_mini/WildScenes2d/deeplabv3_pred_mask
    model: cached_masks
    mask_profile: wildscenes_dirt
    output_dir: ${outputs_root}/local_mini
    h_search_window_sec: 15.0
    class: {name: dirt, id_2d: 2, id_3d_for_h: 1}
    scanline:
      max_ground_distance_m: 20.0
      multi_run_matching: false
      gt_edge_margin_px: 0

  wildscenes_basic:
    dataset: wildscenes_v01
    dataset_overrides:
      pred_mask_dir: ${datasets_root}/61541v003/data/WildScenes/WildScenes2d/V-01/deeplabv3_pred_mask
    model: wildscenes_deeplabv3
    mask_profile: wildscenes_dirt
    output_dir: ${outputs_root}/sequence_V01_dirt
    h_search_window_sec: 15.0
    class: {name: dirt, id_2d: 2, id_3d_for_h: 1}
    segmentation:
      pred_mask_output_dir: ${datasets_root}/61541v003/data/WildScenes/WildScenes2d/V-01/deeplabv3_pred_mask
    scanline:
      max_ground_distance_m: 20.0

  wildscenes_v01:
    dataset: wildscenes_v01
    dataset_overrides:
      min_class_pixels: 600000
      pred_mask_dir: ${datasets_root}/61541v003/data/WildScenes/WildScenes2d/V-01/deeplabv3_pred_mask
    model: wildscenes_deeplabv3
    mask_profile: wildscenes_dirt
    output_dir: ${outputs_root}/sequence_V01_dirt_detailed
    class: {name: dirt, id_2d: 2, id_3d_for_h: 1}
    segmentation:
      pred_mask_output_dir: ${datasets_root}/61541v003/data/WildScenes/WildScenes2d/V-01/deeplabv3_pred_mask
    geometry:
      pose2d_direction: sensor_to_world
      pose3d_direction: sensor_to_world
      max_timestamp_diff_sec: 0.1
      use_distortion: false
    h_search_window_sec: 15.0
    h_candidate_reproj_tolerance_px: 1.0
    min_scanlines_per_frame: 5
    scanline:
      u_min: 300
      u_max: 1700
      max_ground_distance_m: 20.0
